version: "3.9"

services:
  # ── Backend: FastAPI + xarray ocean data server ──────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ocean_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount local NetCDF data directory for zero-download dev
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend: React + CesiumJS 3D globe ──────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ocean_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: ocean_network
